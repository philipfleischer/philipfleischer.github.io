<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="a0f172a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker><marker id="a15803d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="a2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="adc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect width="1200" height="400" fill="#ffffff"/>
<text x="30" y="40" font-size="20" fill="#0f172a" text-anchor="start" font-weight="700">The three networks in the OMNeT++ TicToc tutorial</text>
<text x="30" y="64" font-size="14" fill="#64748b" text-anchor="start" font-weight="400">Every link has a 100 ms delay. The tutorial grows the model step by step from two nodes to a parameter study.</text>
<rect x="30" y="90" width="360" height="285" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="48" y="118" font-size="15" fill="#0f172a" text-anchor="start" font-weight="700">Steps 1–9: two nodes</text>
<rect x="420" y="90" width="360" height="285" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="438" y="118" font-size="15" fill="#0f172a" text-anchor="start" font-weight="700">Steps 10–17: six nodes, random routing</text>
<rect x="810" y="90" width="360" height="285" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="828" y="118" font-size="15" fill="#0f172a" text-anchor="start" font-weight="700">Step 18: parameter study</text>
<circle cx="110" cy="230" r="30" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="110" y="235" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">tic</text>
<circle cx="310" cy="230" r="30" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
<text x="310" y="235" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">toc</text>
<line x1="142" y1="220" x2="278" y2="220" stroke="#0f172a" stroke-width="2" marker-end="url(#a0f172a)"/>
<line x1="278" y1="242" x2="142" y2="242" stroke="#0f172a" stroke-width="2" marker-end="url(#a0f172a)"/>
<text x="210" y="210" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">message</text>
<text x="210" y="262" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">message back</text>
<text x="48" y="330" font-size="12" fill="#64748b" text-anchor="start" font-weight="400">Ping-pong of one message. Later steps add a</text>
<text x="48" y="348" font-size="12" fill="#64748b" text-anchor="start" font-weight="400">counter, random delays, loss, a timeout and</text>
<text x="48" y="366" font-size="12" fill="#64748b" text-anchor="start" font-weight="400">retransmission of a copy (steps 8 and 9).</text>
<line x1="470" y1="230" x2="560" y2="230" stroke="#64748b" stroke-width="2"/>
<line x1="560" y1="230" x2="560" y2="150" stroke="#64748b" stroke-width="2"/>
<line x1="560" y1="230" x2="680" y2="230" stroke="#64748b" stroke-width="2"/>
<line x1="680" y1="310" x2="680" y2="230" stroke="#64748b" stroke-width="2"/>
<line x1="680" y1="230" x2="770" y2="230" stroke="#64748b" stroke-width="2"/>
<circle cx="470" cy="230" r="20" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="470" y="235" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">0</text>
<circle cx="560" cy="230" r="20" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="560" y="235" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">1</text>
<circle cx="560" cy="150" r="20" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="560" y="155" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">2</text>
<circle cx="680" cy="230" r="20" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="680" y="235" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">4</text>
<circle cx="680" cy="310" r="20" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="680" y="315" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">3</text>
<circle cx="770" cy="230" r="20" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="770" y="235" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">5</text>
<text x="612" y="150" font-size="12" fill="#64748b" text-anchor="start" font-weight="400">tic[0..5]</text>
<text x="438" y="348" font-size="12" fill="#64748b" text-anchor="start" font-weight="400">Each node forwards a message on a random gate</text>
<text x="438" y="366" font-size="12" fill="#64748b" text-anchor="start" font-weight="400">until it reaches a random destination (hop count).</text>
<circle cx="850" cy="175" r="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="850" y="180" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">0</text>
<circle cx="850" cy="275" r="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="850" y="280" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">1</text>
<line x1="920" y1="225" x2="980" y2="225" stroke="#64748b" stroke-width="2"/>
<line x1="980" y1="225" x2="1040" y2="225" stroke="#64748b" stroke-width="2"/>
<line x1="1040" y1="225" x2="1100" y2="225" stroke="#64748b" stroke-width="2"/>
<line x1="850" y1="175" x2="920" y2="225" stroke="#64748b" stroke-width="2"/>
<line x1="850" y1="275" x2="920" y2="225" stroke="#64748b" stroke-width="2"/>
<line x1="1100" y1="225" x2="1150" y2="175" stroke="#64748b" stroke-width="2"/>
<line x1="1100" y1="225" x2="1150" y2="275" stroke="#64748b" stroke-width="2"/>
<circle cx="920" cy="225" r="18" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<text x="920" y="230" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">2</text>
<circle cx="980" cy="225" r="18" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<text x="980" y="230" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">3</text>
<circle cx="1040" cy="225" r="18" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<text x="1040" y="230" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">…</text>
<circle cx="1100" cy="225" r="21" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<text x="1100" y="230" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">N+1</text>
<circle cx="1150" cy="175" r="19" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="1150" y="180" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">N+2</text>
<circle cx="1150" cy="275" r="19" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="1150" y="280" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">N+3</text>
<text x="1010" y="285" font-size="12" fill="#b45309" text-anchor="middle" font-weight="600">N central nodes in a chain</text>
<text x="828" y="330" font-size="12" fill="#64748b" text-anchor="start" font-weight="400">N = 2, 4, …, 100, each repeated 4 times with</text>
<text x="828" y="348" font-size="12" fill="#64748b" text-anchor="start" font-weight="400">250 000 s of simulated time. The hop count</text>
<text x="828" y="366" font-size="12" fill="#64748b" text-anchor="start" font-weight="400">is recorded for every message that arrives.</text>
</svg>
